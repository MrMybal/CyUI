name: Publish CyUI showcase

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_showcase.py'
      - 'tests/test_showcase.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate generated pages, resources and navigation
        run: python -B tests/test_showcase.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v4
