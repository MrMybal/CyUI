name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux native window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev
      # On Windows the same configure also builds the Win32 + DX11 demo through CMake.
      - run: cmake -S . -B build/check -DCYUI_BUILD_DEMO=${{ runner.os == 'Windows' && 'ON' || 'OFF' }} -DCYUI_MODULES=All -DCYUI_BUILD_TESTS=ON -DCYUI_BUILD_MARKDOWN_DEMO=ON -DCYUI_BUILD_PORTABLE_DEMO=ON
      - run: cmake --build build/check --config Release --parallel 4
      - if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/check -C Release --output-on-failure
      - if: runner.os != 'Linux'
        run: ctest --test-dir build/check -C Release --output-on-failure
      # Every module alone, configured the way a host does it (plain set() before
      # add_subdirectory): exact dependency closure, host ImGui only, then its checks run.
      # The ImGui library built above stands in for the host's, so ImGui compiles once.
      - name: Module isolation matrix
        shell: bash
        run: |
          imgui=$(find build/check \( -name cyui_imgui.lib -o -name libcyui_imgui.a \) -print -quit)
          test -n "$imgui"
          python tests/module_matrix.py --imgui-library "$imgui" --build-dir build/matrix
  windows-demo:
    # The no-CMake build in build_demo.bat (MSVC found by vswhere), as documented in README.md.
    # The CEF adapter (CYUI_BUILD_WEB_CEF) is not built here: it needs a CEF binary
    # distribution (hundreds of MB per OS/architecture) that the repository does not ship.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: cmd
        run: build_demo.bat
      - shell: bash
        run: test -f build/cyui_demo.exe
  python-and-web:
    runs-on: ubuntu-latest
    env:
      # A missing or broken imgui-bundle fails the run instead of skipping the frame tests.
      CYUI_REQUIRE_UI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm ci --prefix .CyDocBuild --omit=optional
      - run: python .CyDocBuild/build.py --check
      - run: python -B tests/test_documentation.py
      - run: python -B tests/test_showcase.py
      - run: python -B tools/generate_locales.py --check
      - run: python -B tests/test_python_modules.py
      - run: python -B tests/test_documents.py
      - run: python -B tests/test_editor_modules.py
      - run: python -B tests/test_unreal_package.py
      - run: node --test tests/web_bridge.test.mjs
